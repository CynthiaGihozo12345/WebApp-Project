
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODERWANDA Ltd | Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(120deg, #071d35, #087f8c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-box {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .logo {
            color: #35c5a0;
            text-align: center;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            color: #087f8c;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #071d35;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        a {
            color: #087f8c;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">CODERWANDA Ltd</div>

    <h2>Create Account</h2>

    <p class="subtitle">Join our digital community in Rwanda</p>

    <form action="#" method="POST">

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Create a password" minlength="8" required>

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password"
               name="confirm_password"
               placeholder="Confirm your password" minlength="8" required>

        <button type="submit">Create Account</button>

    </form>

    <div class="links">
        <p>Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <p><a href="index.html">Back to Home</a></p>
    </div>

</div>

</body>
</html>
